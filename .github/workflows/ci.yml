name: CI - Build and Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build Frontend
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Runner Information
        run: |
          echo "Runner Name: $RUNNER_NAME"
          echo "Runner OS: $RUNNER_OS"
          node --version
          npm --version

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build